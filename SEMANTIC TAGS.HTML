<body>
    <form>
        <fieldset>
        <legend>A Registration Form</legend>
    <table cellpadding = "10">
        <tr>
            <td>
                <label for = "fname">First Name</label>
                <td>:</td>
                <td><input type="text" id = "fname" maxlength="20" minlength="3">
                (Max 20 char a-z and A-Z)
                </td>
            </td>
        </tr>
        <tr>
            <td>
                <label for = "lname">Last Name</label>
                <td>:</td>
                <td><input type="text" id = "lname" maxlength="20" minlength="3">
                (Max 20 char a-z and A-Z)
                </td>
            </td>
        </tr>
        <tr>
            <td>
                <label for = "dob">Date Of Birth</label>
                <td>:</td>
                <td><input type="date" id = "dob">
                </td>
            </td>
        </tr>
        <tr>
            <td>
                <label for = "gender">Gender</label>
                <td>:</td>
                <td>
                    <input type = "radio" id = "male" name = "gender">
                    <label for = "male">Male</label>
                    <input type = "radio" id = "female" name = "gender">
                    <label for = "female">Female</label>
                    <input type = "radio" id = "other" name = "gender">
                    <label for = "other">Other</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "phone">Phone Number</label>
                    <td>:</td>
                    <td><input type = "number" id = "phone" maxlength="10" minlength="10">
                    (10 digit number)</td>
        </tr>
        <tr>
            <td>
                <label for = "email">Email</label>
                <td>:</td>
                <td><input type = "email" id = "email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "address">Address</label>
                    <td>:</td>
                    <td><textarea id = "address"></textarea>
                    </td>
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "City">City</label>
                    <td>:</td>
                    <td><input type = "text" id = "City">
                    </td>
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "pin">Pin Code</label>
                    <td>:</td>
                    <td><input type = "number" id = "pin">
                    (6 digit number)
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "state">State</label>
                    <td>:</td>
                    <td><input type = "text" id = "state">
                    </td>
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "country">Country</label>
                    <td>:</td>
                    <td><input type = "text" id = "country">
                    </td>
                </td>
                <br>
                <br>
            <tr>
        <td>Hobbies</td>
        <td>:</td>

            <input type="checkbox"> Dancing
            <input type="checkbox"> Drawing
            <br><br>
            <input type="checkbox"> Others
            <input type="text">
        </td>
    </tr>
</table>
